<form action="{% url 'seguridad:usuarios' %}" method="post" onsubmit="return enviar_formulario(this)">
    {% csrf_token %}
    <input type="hidden" name="action" value="asignar">
    <div class="modal-header">
        <h5 class="modal-title">Asignar perfil</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body">
        <div class="alert alert-info small">
            Estos usuarios existen pero no tienen perfil, asi que el sistema no sabe
            que rol darles. Asignales uno para que puedan usar su panel.
        </div>
        {{ form.as_p }}
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary">Asignar</button>
    </div>
</form>
