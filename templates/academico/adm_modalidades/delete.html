<form action="{% url 'adm_modalidades' %}" method="post" onsubmit="return enviar_formulario(this)">
    {% csrf_token %}
    <input type="hidden" name="pk" value="{{ object.pk }}">
    <input type="hidden" name="action" value="delete">
    <div class="modal-header">
        <h5 class="modal-title">Eliminar modalidad</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body">
        Esta seguro de eliminar <strong>{{ object }}</strong>?
        {% if object.carreras.exists %}
            <div class="alert alert-warning mt-2 mb-0">
                La estan usando {{ object.carreras.count }} carrera(s). Cambialas de
                modalidad antes de eliminarla.
            </div>
        {% endif %}
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-danger">Eliminar</button>
    </div>
</form>
