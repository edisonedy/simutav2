<form id="mallaForm" action="{% url 'adm_mallas' %}" method="post" onsubmit="return enviar_formulario(this)">
    {% csrf_token %}
    <input type="hidden" name="pk" value="{{ malla.pk }}">
    <input type="hidden" name="action" value="edit">
    <div class="modal-header">
        <h5 class="modal-title">Editar malla</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body">
        {{ form.as_p }}
        <p class="text-muted mb-0">
            Los niveles, las asignaturas de la malla y sus requisitos se arman en
            <a href="{% url 'adm_mallas' %}?action=estructura&amp;pk={{ malla.pk }}">Asignaturas de la malla</a>.
        </p>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
    </div>
</form>
