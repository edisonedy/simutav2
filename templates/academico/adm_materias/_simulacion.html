<div class="border rounded p-2 mb-2 bg-white">
    <div class="d-flex justify-content-between align-items-start gap-2">
        <div>
            <span class="badge text-bg-primary">Simulacion</span>
            <div class="cell-strong mt-1">{{ simulacion.titulo }}</div>
            {% if simulacion.objetivo %}<div class="text-muted small">{{ simulacion.objetivo }}</div>{% endif %}
        </div>
        <a class="btn btn-sm btn-outline-primary"
           href="{% url 'pro_simulaciones' %}?action=configuracion&id={{ simulacion.pk }}">Configurar</a>
    </div>
</div>
